# Система наград на подпути существующего сайта.
# Вариант для nginx, установленного на самом сервере (пакет nginx).
#
# Куда положить: добавьте блок location внутрь УЖЕ существующего
# server { ... } вашего сайта — обычно это файл
#   /etc/nginx/sites-available/<ваш-сайт>
# Отдельный server-блок создавать не нужно, домен и сертификат уже есть.
#
# Замените /stars на свой подпуть, если он другой.

    # ── Система наград ───────────────────────────────────────────────────────
    location /stars/ {
        # Завершающий слэш в proxy_pass ОБЯЗАТЕЛЕН: он срезает /stars,
        # и приложение внутри работает так, будто живёт в корне.
        proxy_pass http://127.0.0.1:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /stars;

        # Учитель грузит фотографии призов до 5 МБ.
        # По умолчанию nginx режет запросы на 1 МБ и отдаёт ошибку 413.
        client_max_body_size 6m;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # Адрес без завершающего слэша тоже должен работать
    location = /stars {
        return 301 /stars/;
    }
