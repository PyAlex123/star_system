# Система наград в КОРНЕ домена finlo.uz.
#
# На сервере уже есть рабочий конфиг /etc/nginx/sites-available/finlo.uz:
# домен, сертификат от certbot и редирект с http на https настроены и работают.
# Поэтому создавать новый server-блок НЕ НУЖНО — достаточно поменять адрес,
# на который nginx проксирует запросы.
#
# Было (контейнер finance-dashboard):   proxy_pass http://127.0.0.1:8090;
# Стало (наша система):                 proxy_pass http://127.0.0.1:8010;
#
# ────────────────────────────────────────────────────────────────────────────
#  ПОРЯДОК ДЕЙСТВИЙ
#
#  1. Копия на случай отката:
#         sudo cp /etc/nginx/sites-available/finlo.uz /root/finlo.uz.backup
#
#  2. Поменять порт:
#         sudo sed -i 's|proxy_pass http://127.0.0.1:8090;|proxy_pass http://127.0.0.1:8010;|' \
#             /etc/nginx/sites-available/finlo.uz
#
#  3. Проверить и применить:
#         sudo nginx -t && sudo systemctl reload nginx
#
#  ОТКАТ (старая система вернётся на finlo.uz за несколько секунд):
#         sudo cp /root/finlo.uz.backup /etc/nginx/sites-available/finlo.uz
#         sudo nginx -t && sudo systemctl reload nginx
# ────────────────────────────────────────────────────────────────────────────
#
# Почему порт 8010, а не 8000: на сервере 8000 занят сторонним процессом
# uvicorn, не связанным с finlo.uz. Наш контейнер слушает только 127.0.0.1,
# снаружи он недоступен — наружу смотрит исключительно nginx.
#
# client_max_body_size в существующем конфиге уже 500M, этого с запасом
# хватает на фотографии призов (лимит приложения — 5 МБ).


# ── Так должен выглядеть location / после правки ─────────────────────────────

    location / {
        proxy_pass http://127.0.0.1:8010;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }


# ── Если понадобится вернуть систему на подпуть ──────────────────────────────
# Смотрите deploy/nginx-host.conf: там вариант для адреса вида finlo.uz/stars.
# В .env тогда нужно выставить URL_PREFIX=/stars.
