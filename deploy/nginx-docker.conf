# То же самое, но если nginx у вас работает в Docker-контейнере.
#
# Отличие одно: обращаемся не к 127.0.0.1 (внутри контейнера nginx это он сам),
# а к имени контейнера в общей docker-сети.
#
# Перед этим в docker-compose.yml:
#   * уберите блок ports,
#   * верните networks с именем вашей сети (см. комментарий в конце файла).
#
# Проверить имя сети:  docker network ls

    # ── Система наград ───────────────────────────────────────────────────────
    location /stars/ {
        # Имя контейнера из docker-compose.yml (container_name: school-stars)
        proxy_pass http://school-stars:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /stars;

        # Фотографии призов до 5 МБ — иначе nginx отдаст 413
        client_max_body_size 6m;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    location = /stars {
        return 301 /stars/;
    }
