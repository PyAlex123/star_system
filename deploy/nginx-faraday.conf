# Система наград по адресу https://faraday.uz/star_system/ — через прокси чужого сервера.
#
# Сайт faraday.uz живёт на сервере партнёра. Его nginx пересылает /star_system/ на наш
# сервер (finlo.uz), а наш nginx — в контейнер. Доступ к нашему серверу, .env, паролям
# и токену бота партнёру не нужен: ему передаётся только ЧАСТЬ 1.
#
#   браузер → https://faraday.uz/star_system/…   (их nginx, их сертификат)
#           → https://finlo.uz/star_system/…     (наш nginx: срезает /star_system)
#           → контейнер 127.0.0.1:8010
#   старые ссылки finlo.uz/… → 301 на https://faraday.uz/star_system/…
#
# Их прокси ходит на finlo.uz/star_system/, а не в корень finlo.uz. Поэтому корень можно
# перенаправить на новый адрес без петли — старые плакаты, ссылки и кнопки в Telegram
# продолжают работать.
#
# Помните: их сервер расшифровывает HTTPS и технически видит весь трафик системы,
# включая пароли учителей при входе. Так устроена любая схема с чужим прокси.


# ════════════════════════════════════════════════════════════════════════════
#  ЧАСТЬ 1. Для администратора faraday.uz — внутрь server { … } сайта (порт 443)
# ════════════════════════════════════════════════════════════════════════════

    location /star_system/ {
        proxy_pass https://finlo.uz/star_system/;
        proxy_ssl_server_name on;                    # SNI: без него наш сервер не поймёт, какой сертификат отдать
        proxy_set_header Host finlo.uz;              # именно finlo.uz, не $host
        proxy_set_header X-Real-IP $remote_addr;     # настоящий адрес посетителя — для лимитов попыток входа
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        client_max_body_size 6m;                     # фотографии призов до 5 МБ
        proxy_read_timeout 60s;
    }
    location = /star_system { return 301 /star_system/; }

# Затем:  sudo nginx -t && sudo systemctl reload nginx
#
# Если у них не nginx — то же словами: проксировать /star_system/* на
# https://finlo.uz/star_system/*, заголовок Host = finlo.uz, передавать X-Real-IP
# посетителя, разрешить тело запроса до 6 МБ. И сообщить исходящий IP их сервера.


# ════════════════════════════════════════════════════════════════════════════
#  ЧАСТЬ 2. Наш сервер — /etc/nginx/sites-available/finlo.uz
# ════════════════════════════════════════════════════════════════════════════
#
#  1. Копии на случай отката:
#         sudo bash deploy/backup.sh
#         cp .env ~/env.before-faraday
#         sudo cp /etc/nginx/sites-available/finlo.uz /root/finlo.uz.before-faraday
#
#  2. В .env:
#         BASE_URL=https://faraday.uz
#         URL_PREFIX=/star_system
#         USE_WEBHOOK=0
#     USE_WEBHOOK=0 — бот сам забирает сообщения у Telegram и не зависит от чужого
#     сервера; секрет webhook (он выводится из токена) не проходит через их прокси.
#
#  3. В конфиге finlo.uz заменить весь блок  location / { … proxy_pass …8010 … }
#     на два блока ниже.
#
#  4. Применить:
#         docker compose up -d
#         sudo nginx -t && sudo systemctl reload nginx
#
#  5. IP их сервера: пока он неизвестен, строки set_real_ip_from и real_ip_header
#     закомментированы — сайт работает, но лимиты попыток входа общие на всех,
#     кто пришёл через faraday.uz. IP виден в логе (первое поле):
#         sudo tail -5 /var/log/nginx/access.log | grep star_system
#     Вписать его, снять комментарии и снова  sudo nginx -t && sudo systemctl reload nginx
#
#  ОТКАТ (система снова на finlo.uz):
#         cp ~/env.before-faraday .env
#         sudo cp /root/finlo.uz.before-faraday /etc/nginx/sites-available/finlo.uz
#         docker compose up -d
#         sudo nginx -t && sudo systemctl reload nginx

    location /star_system/ {
        # set_real_ip_from <IP сервера faraday.uz>;   # доверяем X-Real-IP только от него
        # real_ip_header   X-Real-IP;

        proxy_pass http://127.0.0.1:8010/;           # завершающий слэш срезает /star_system

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # Старые адреса finlo.uz/… — на новый адрес с тем же путём
    location / {
        return 301 https://faraday.uz/star_system$request_uri;
    }
