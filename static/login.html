<!DOCTYPE html>
<html lang="ru" data-theme="{{THEME}}" data-mode="{{MODE}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход в панель учителя</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpolygon fill=%27%23E3A21A%27 points=%2712 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="{{BASE}}/static/css/tokens.css">
<link rel="stylesheet" href="{{BASE}}/static/css/theme.css">
<link rel="stylesheet" href="{{BASE}}/static/css/auth.css">
</head>
<body class="auth" data-night>

{{ICONS}}

<form class="auth-card auth-col" data-day onsubmit="submitLogin(event)" novalidate>
  <a class="back-link" href="{{BASE}}/"><svg class="ic ic-sm"><use href="#i-arrow-left"></use></svg>Выбор входа</a>

  <div class="auth-head">
    <span class="stamp"><span><svg class="ic"><use href="#i-star"></use></svg></span></span>
    <div>
      <div class="auth-title">Панель учителя</div>
      <div class="auth-sub">Журнал звёзд и карточки классов</div>
    </div>
  </div>

  <div class="field">
    <label for="login">Логин</label>
    <input type="text" id="login" class="input-mono" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required>
  </div>

  <div class="field">
    <label for="password">Пароль</label>
    <span class="with-eye">
      <input type="password" id="password" autocomplete="current-password" required>
      <button type="button" class="icon-btn" id="eyeBtn" onclick="togglePasswordView()"
              aria-label="Показать пароль" title="Показать пароль"><svg class="ic"><use href="#i-eye"></use></svg></button>
    </span>
  </div>

  <div class="form-error" id="error" role="alert" hidden>
    <svg class="ic"><use href="#i-warning"></use></svg><span id="errorText"></span>
  </div>

  <button class="btn btn-block" type="submit" id="submitBtn">Войти</button>
</form>

<script>
const BASE = "{{BASE}}";

function togglePasswordView() {
  const input = document.getElementById("password");
  const show = input.type === "password";
  input.type = show ? "text" : "password";
  const button = document.getElementById("eyeBtn");
  const label = show ? "Скрыть пароль" : "Показать пароль";
  button.setAttribute("aria-label", label);
  button.title = label;
  button.querySelector("use").setAttribute("href", show ? "#i-eye-off" : "#i-eye");
}

async function submitLogin(event) {
  event.preventDefault();
  const button = document.getElementById("submitBtn");
  const errorBox = document.getElementById("error");
  const login = document.getElementById("login").value.trim();
  const password = document.getElementById("password").value;
  errorBox.hidden = true;
  if (!login || !password) {
    document.getElementById("errorText").textContent = "Введите логин и пароль";
    errorBox.hidden = false;
    return;
  }
  button.disabled = true;
  try {
    const response = await fetch(BASE + "/api/auth/teacher", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ login, password }),
    });
    if (!response.ok) {
      const payload = await response.json().catch(() => ({}));
      throw new Error(payload.detail || "Не удалось войти");
    }
    // next приходит из нашего же редиректа и уже содержит подпуть.
    // Внешние адреса не пускаем — только пути своего сайта.
    const next = new URLSearchParams(location.search).get("next") || "";
    const safe = next.startsWith("/") && !next.startsWith("//") ? next : BASE + "/teacher";
    location.href = safe;
  } catch (error) {
    document.getElementById("errorText").textContent = error.message;
    errorBox.hidden = false;
    button.disabled = false;
  }
}
</script>
</body>
</html>
