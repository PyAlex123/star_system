<!DOCTYPE html>
<html lang="ru" data-theme="{{THEME}}" data-mode="{{MODE}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Журнал звёзд</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpolygon fill=%27%23E3A21A%27 points=%2712 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="{{BASE}}/static/css/tokens.css">
<link rel="stylesheet" href="{{BASE}}/static/css/theme.css">
<link rel="stylesheet" href="{{BASE}}/static/css/auth.css">
</head>
<body class="auth" data-night>

{{ICONS}}

<main class="auth-card auth-col" data-day>
  <div class="auth-head">
    <span class="stamp"><span><svg class="ic"><use href="#i-star"></use></svg></span></span>
    <div>
      <h1 class="auth-title">Журнал звёзд</h1>
      <div class="auth-sub">Звёзды за уроки и призы, на которые их можно обменять</div>
    </div>
  </div>

  <nav class="entry-choices" aria-label="Выбор входа">
    <a class="entry-choice student" href="{{BASE}}/enter">
      <span class="entry-icon"><svg class="ic"><use href="#i-user"></use></svg></span>
      <span class="entry-text">
        <span class="entry-title">Я ученик</span>
        <span class="entry-note">Вход по логину и паролю с карточки</span>
      </span>
      <svg class="ic"><use href="#i-arrow-right"></use></svg>
    </a>
    <a class="entry-choice teacher" href="{{BASE}}/teacher">
      <span class="entry-icon"><svg class="ic"><use href="#i-school"></use></svg></span>
      <span class="entry-text">
        <span class="entry-title">Я учитель</span>
        <span class="entry-note">Журнал, классы, призы и карточки</span>
      </span>
      <svg class="ic"><use href="#i-arrow-right"></use></svg>
    </a>
  </nav>

  <p class="auth-help" style="padding:0">
    <svg class="ic"><use href="#i-help"></use></svg>
    <span>Есть Telegram? Отсканируй QR-код со своей карточки — откроется бот, и в кабинет можно будет заходить без логина и пароля.</span>
  </p>
</main>

</body>
</html>
