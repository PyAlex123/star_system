<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Журнал звёзд</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath fill=%27%23b07d12%27 d=%27M12 2.8l2.76 5.6 6.18.9-4.47 4.36 1.06 6.15L12 16.9l-5.53 2.91 1.06-6.15L3.06 9.3l6.18-.9z%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="{{BASE}}/static/css/theme.css">
<link rel="stylesheet" href="{{BASE}}/static/css/auth.css">
</head>
<body>

{{ICONS}}

<main class="box">
  <div class="mark"><svg class="ic"><use href="#i-star"></use></svg></div>
  <h1>Журнал звёзд</h1>
  <p class="sub">Звёзды за уроки и призы, на которые их можно обменять</p>

  <nav class="entry-choices" aria-label="Выбор входа">
    <a class="entry-choice student" href="{{BASE}}/enter">
      <span class="entry-icon"><svg class="ic"><use href="#i-user"></use></svg></span>
      <span class="entry-text">
        <span class="entry-title">Я ученик</span>
        <span class="entry-note">Вход по логину и паролю с карточки</span>
      </span>
      <svg class="ic"><use href="#i-arrow-right"></use></svg>
    </a>

    <a class="entry-choice teacher" href="{{BASE}}/teacher">
      <span class="entry-icon"><svg class="ic"><use href="#i-school"></use></svg></span>
      <span class="entry-text">
        <span class="entry-title">Я учитель</span>
        <span class="entry-note">Журнал, классы, призы и карточки</span>
      </span>
      <svg class="ic"><use href="#i-arrow-right"></use></svg>
    </a>
  </nav>

  <p class="hint">
    Есть Telegram? Отсканируй QR-код со своей карточки — откроется бот,
    и в кабинет можно будет заходить без логина и пароля.
  </p>
</main>

</body>
</html>
