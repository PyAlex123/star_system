<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Вход в кабинет ученика</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath fill=%27%23b07d12%27 d=%27M12 2.8l2.76 5.6 6.18.9-4.47 4.36 1.06 6.15L12 16.9l-5.53 2.91 1.06-6.15L3.06 9.3l6.18-.9z%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="{{BASE}}/static/css/theme.css">
<style>
  body {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--paper);
  }
  .box {
    width: 100%;
    max-width: 370px;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-top: 3px solid var(--gold);
    border-radius: var(--r-card);
    padding: 28px 26px;
  }
  .mark {
    width: 40px; height: 40px;
    border-radius: var(--r-field);
    background: var(--gold);
    color: #fffdf8;
    display: grid;
    place-items: center;
    margin-bottom: 16px;
  }
  .mark .ic { width: 22px; height: 22px; vertical-align: 0; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 22px; }
  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
  input { width: 100%; }
  .field { margin-bottom: 14px; }
  .btn { margin-top: 4px; }
  .error {
    display: none;
    margin-top: 12px;
    background: var(--danger-soft);
    border: 1px solid var(--danger-line);
    color: var(--danger);
    border-radius: var(--r-field);
    padding: 9px 12px;
    font-size: 13px;
    font-weight: 500;
  }
  .error.show { display: flex; align-items: center; gap: 8px; }
  .hint {
    margin: 20px 0 0;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.55;
  }
</style>
</head>
<body>

{{ICONS}}

<form class="box" onsubmit="submitLogin(event)">
  <div class="mark"><svg class="ic"><use href="#i-star"></use></svg></div>
  <h1>Вход в кабинет</h1>
  <p class="sub">Логин и пароль — на твоей карточке</p>

  <div class="field">
    <label for="login">Логин</label>
    <input type="text" id="login" autocomplete="username" autocapitalize="off"
           spellcheck="false" placeholder="ivanov.artem" autofocus required>
  </div>

  <div class="field">
    <label for="password">Пароль</label>
    <input type="password" id="password" autocomplete="current-password" required>
  </div>

  <button class="btn btn-block" type="submit" id="submitBtn">Войти</button>

  <div class="error" id="error">
    <svg class="ic ic-sm"><use href="#i-warning"></use></svg><span id="errorText"></span>
  </div>

  <p class="hint">
    Есть Telegram? Проще зайти по QR-коду с карточки — тогда логин и пароль не нужны.<br>
    Потерял карточку или забыл пароль — подойди к учителю, он выдаст новый.
  </p>
</form>

<script>
const BASE = "{{BASE}}";

async function submitLogin(event) {
  event.preventDefault();
  const button = document.getElementById("submitBtn");
  const errorBox = document.getElementById("error");
  button.disabled = true;
  errorBox.classList.remove("show");

  try {
    const response = await fetch(BASE + "/api/auth/student", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        login: document.getElementById("login").value,
        password: document.getElementById("password").value,
      }),
    });
    const payload = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(payload.detail || "Не удалось войти");

    // Кабинет читает сессию отсюда же — отдельного входа ему не нужно.
    sessionStorage.setItem("stars_token", payload.token);
    location.href = BASE + "/app";
  } catch (error) {
    document.getElementById("errorText").textContent = error.message;
    errorBox.classList.add("show");
    button.disabled = false;
  }
}
</script>
</body>
</html>
