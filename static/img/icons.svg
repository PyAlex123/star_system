<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
<!--
  Набор иконок системы — Lucide, как в макетах docs/design. Все символы 24×24,
  линия 1.75, цвет наследуется (currentColor).

  Вставляется прямо в страницу: render_page в backend/main.py подменяет
  плейсхолдер ICONS в фигурных скобках содержимым этого файла.
  Сам плейсхолдер здесь не пишем — иначе он попадёт в каждую готовую
  страницу и собьёт проверки «все ли шаблоны подставлены».
  Так иконки работают и в старых WebView Telegram, где внешний спрайт через
  <use href="файл.svg#id"> иногда не подгружается.

  Звезда залита цветом текста; обводку задаёт переменная —ic-stroke
  (в темах «квест» и «стикербук» у звезды тёмная кромка).

  Использование:  <svg class="ic"><use href="#i-star"></use></svg>
-->

